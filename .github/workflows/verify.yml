name: Verify

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify_migration_scripts:
    name: Check migration script filenames
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Validate migration script filenames
        run: sh ./script/verify_migration_scripts

  gradle_build:
    name: Gradle Build
    needs: verify_migration_scripts
    permissions:
      contents: read
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    with:
      gradle-command: './gradlew assemble testClasses'
      upload-test-artifacts: false
    secrets: inherit

  helm-lint:
    name: Helm lint
    strategy:
      matrix:
        environments: ['development', 'test', 'preprod', 'prod']
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2 # WORKFLOW_VERSION
    secrets: inherit
    with:
      environment: ${{ matrix.environments }}

  ktlint-check:
    name: KtLintCheck
    needs: gradle_build
    permissions:
      contents: read
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    with:
      gradle-command: './gradlew ktlintCheck'
      upload-test-artifacts: false
    secrets: inherit

  detekt:
    name: detekt
    needs: gradle_build
    permissions:
      contents: read
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    with:
      gradle-command: './gradlew detekt'
      upload-test-artifacts: false
    secrets: inherit

  unit_test:
    name: Unit Tests
    needs: gradle_build
    permissions:
      contents: read
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/gradle_verify.yml@v2 # WORKFLOW_VERSION
    with:
      gradle-command: './gradlew unitTest'
      artifact-name: 'unit-test-results'
    secrets: inherit

  integration_test_sharding_tests:
    name: Integration test sharding code tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: 'false'

      - name: Test integration test sharding code
        run: python3 -m unittest discover -s script -p test_integration_test_shards.py

  determine_integration_test_shards:
    name: Determine integration test shards
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.split-tests.outputs.matrix }}
      shards: ${{ steps.split-tests.outputs.shards }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: 'false'

      - name: Download latest main-branch integration timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p integration-timings
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=integration-test-timings&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$run_id" ]; then
            echo "Using integration timings from run $run_id"
            gh run download "$run_id" --name integration-test-timings --dir integration-timings
          else
            echo "No previous main-branch integration timings found; using round-robin allocation"
          fi

      - name: Determine tests splitting
        id: split-tests
        run: python3 script/integration_test_shards.py split --shards 12 --timings-dir integration-timings

  integration_test:
    name: Integration Test (${{ matrix.shard.number }})
    runs-on: ubuntu-latest
    needs: [gradle_build, determine_integration_test_shards]
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.determine_integration_test_shards.outputs.matrix) }}
    env:
      _JAVA_OPTIONS: "-Xmx3g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
      POSTGRES_PORT: 5432
      SPRING_DATA_REDIS_PORT: 6379
    services:
      redis:
        image: "redis:latest"
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
        env:
          ALLOW_EMPTY_PASSWORD: yes
      postgres:
        image: "postgis/postgis:18-3.6"

        env:
          POSTGRES_USER: api_user
          POSTGRES_PASSWORD: api_user_password
          POSTGRES_DB: unused

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Maps tcp port 5432 on service container to the host
          - 5432:5432
      localstack:
        image: localstack/localstack:community-archive
        ports:
          - 4466:4566
          - 4471:4571
        env:
          ES_PORT_EXTERNAL: 4571
          DOCKER_HOST: 'unix:///var/run/docker.sock'
          AWS_EXECUTION_ENV: True
          PERSISTENCE: 1
          SERVICES: sns,sqs
          DEFAULT_REGION: eu-west-2
          DATA_DIR: /tmp/localstack/data

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: 'false'

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Run integration test
        env:
          TEST_SUITE: ${{ toJSON(fromJSON(needs.determine_integration_test_shards.outputs.shards)[matrix.shard.index]) }}
        run: |
          specs=$(jq -er 'if type == "array" and length > 0 and all(.[]; type == "string" and length > 0) then .[] else error("Invalid integration test shard") end' <<< "$TEST_SUITE")
          args=()
          while IFS= read -r spec; do
            args+=(--tests "$spec")
          done <<< "$specs"
          ./gradlew integrationTest "${args[@]}"

      - name: Collect integration test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 script/integration_test_shards.py collect build/test-results/integrationTest integration-timings-${{ matrix.shard.number }}.json

      - name: Upload integration test timings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-timing-part-${{ matrix.shard.number }}
          path: integration-timings-${{ matrix.shard.number }}.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Upload raw test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-results-${{ matrix.shard.number }}-of-${{ strategy.job-total }}
          path: |
            build/test-results
            build/reports/tests

      - name: publish test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Integration Test Report
          path: './build/test-results/integrationTest/*.xml'
          reporter: java-junit
          fail-on-empty: false
          fail-on-error: false
          list-suites: 'failed'
          list-tests: 'failed'

  publish_integration_timings:
    name: Publish integration test timings
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: integration_test
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Download integration test timings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: integration-test-timing-part-*
          path: integration-timings
          merge-multiple: true

      - name: Publish integration test timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-test-timings
          path: integration-timings/*.json
          retention-days: 90
          if-no-files-found: error
          overwrite: true
